<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SlowItDown</title>
</head>

<body>
    <header>
        <h1>Slow It Down</h1>
    </header>
    <div class="Controls">
        <div class="PlaybackSpeed">
            <label>Playback Speed</label>
            <input type="range" min="0.25" max="2.0" step="0.05" value="1.0" id="speed"><br><span
                id="speed-val">1.0</span>
        </div>
        <div class="ReverbLevel">
            <label>Reverb Level</label>
            <input type="range" min="0" max="1" step="0.05" value="0" id="reverb"><br><span id="reverb-val">0</span>
        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
